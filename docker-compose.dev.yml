# Development override — bind-mounts local code for live editing
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# After a pull or any edit, refresh the running container in one shot:
#   scripts/dev-refresh.sh          # rebuild UI + restart backend + smoke test
#   scripts/dev-refresh.sh --deps   # ...also reinstall npm deps (package*.json changed)
#
# Or by hand:
#   Backend (src/, bin/):   docker compose exec tapestry supervisorctl restart brainstorm
#   Frontend (ui/):         docker compose exec tapestry sh -c \
#                             'cd /usr/local/lib/node_modules/brainstorm/ui && npm run build'
#                           The ui/ SPA is a Vite build — a browser refresh alone is NOT
#                           enough; dist/ must be rebuilt first.
#   Legacy pages (public/): just refresh the browser (served straight from disk).

services:
  tapestry:
    volumes:
      # Bind-mount local repo over the baked-in code
      - .:/usr/local/lib/node_modules/brainstorm
      # Preserve container's node_modules (avoids platform mismatch)
      - tapestry-node-modules:/usr/local/lib/node_modules/brainstorm/node_modules
      # Persist data across recreates
      - tapestry-neo4j:/var/lib/neo4j/data
      - tapestry-strfry:/var/lib/strfry
      - tapestry-data:/var/lib/brainstorm
      - tapestry-logs:/var/log/brainstorm

volumes:
  tapestry-node-modules:
