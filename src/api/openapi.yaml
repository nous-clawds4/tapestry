openapi: 3.0.3
info:
  title: Tapestry API
  description: |
    REST API for the Tapestry decentralized knowledge graph protocol.

    Tapestry takes flat nostr events (DList events) and weaves them into a navigable,
    validated concept graph stored in Neo4j. This API provides endpoints for managing
    concepts, auditing the graph, querying Neo4j, interacting with the strfry relay,
    searching profiles via Meilisearch, and more.

    **Authentication:** Most write endpoints require a NIP-07 session. Use the Auth
    endpoints to obtain a session. Owner-only endpoints require the instance owner's pubkey.
  version: 1.0.0
  contact:
    name: Tapestry
    url: https://github.com/nous-clawds4/tapestry

servers:
  - url: http://localhost:8080
    description: Local development (Docker / host nginx)
  - url: http://localhost:7778
    description: Direct Express server

tags:
  - name: Auth
    description: NIP-07 authentication and session management
  - name: Normalize
    description: Concept creation, normalization, and graph wiring
  - name: Audit
    description: Graph health checks, statistics, and diagnostics
  - name: Firmware
    description: Tapestry firmware installation and inspection
  - name: Neo4j
    description: Direct Neo4j queries and event sync
  - name: Strfry
    description: Local nostr relay operations (scan, publish, sync)
  - name: Settings
    description: Instance settings (owner-only)
  - name: Search
    description: Profile search via Meilisearch and keyword engines
  - name: Grapevine
    description: Web of Trust preferences and interactions
  - name: User Preferences
    description: Per-user preference storage
  - name: Property
    description: Concept property and JSON Schema management
  - name: Trusted List
    description: Publish NIP trusted list events
  - name: IO
    description: Import and export concept data
  - name: Tapestry Key
    description: LMDB key-value store and JSON derivation
  - name: Profiles
    description: Nostr profile fetching
  - name: Users
    description: Per-user data, counts, and trust metrics from the WoT graph
  - name: Customers
    description: Customer management (owner-only)
  - name: Status
    description: Instance and service status
  - name: Algos
    description: GrapeRank, PageRank, hops, and other algorithms
  - name: NIP-85
    description: NIP-85 trusted assertion events
  - name: Pipeline
    description: Data pipeline operations (sync, reconciliation)
  - name: Manage
    description: Task execution and service control
  - name: Neo4j Health
    description: Neo4j performance metrics and health monitoring

paths:
  # ──────────────────────────────────────────────
  # Auth
  # ──────────────────────────────────────────────
  /api/auth/verify:
    post:
      tags: [Auth]
      summary: Request a NIP-07 challenge
      description: Returns a challenge string for the client to sign with NIP-07.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                signature:
                  type: string
                data:
                  type: string
      responses:
        '200':
          description: Challenge or verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthVerifyResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Submit signed challenge to log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pubkey:
                  type: string
                  description: Hex-encoded public key
                signature:
                  type: string
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/auth/verify-user:
    post:
      tags: [Auth]
      summary: Request a NIP-07 challenge (user variant)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                signature:
                  type: string
                data:
                  type: string
      responses:
        '200':
          description: Challenge or verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthVerifyResponse'

  /api/auth/login-user:
    post:
      tags: [Auth]
      summary: Submit signed challenge to log in (user variant)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pubkey:
                  type: string
                signature:
                  type: string
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: End current session
      responses:
        '200':
          description: Session ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/auth/status:
    get:
      tags: [Auth]
      summary: Check current auth status
      responses:
        '200':
          description: Authentication state
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  authenticated:
                    type: boolean
                  pubkey:
                    type: string

  /api/auth/user-classification:
    get:
      tags: [Auth]
      summary: Get user role classification
      description: Returns the role of the current session user (owner, admin, customer, guest, unauthenticated).
      responses:
        '200':
          description: User classification
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  classification:
                    type: string
                    enum: [owner, admin, customer, guest, unauthenticated]
                  pubkey:
                    type: string
                  customerName:
                    type: string
                  customerId:
                    type: string

  /api/auth/sign-up-new-customer:
    post:
      tags: [Auth]
      summary: Sign up as a new customer
      description: Requires an authenticated session. Creates a customer account with relay keys.
      responses:
        '200':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/auth/test:
    get:
      tags: [Auth]
      summary: Test authentication endpoint
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  timestamp:
                    type: number

  # ──────────────────────────────────────────────
  # Normalize
  # ──────────────────────────────────────────────
  /api/normalize/create-concept:
    post:
      tags: [Normalize]
      summary: Create a full concept with all 8 core nodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Concept name (e.g. "dogs")
                plural:
                  type: string
                description:
                  type: string
                dTag:
                  type: string
                nonce:
                  type: integer
                random:
                  type: boolean
                conceptHeaderOverrides:
                  type: object
      responses:
        '200':
          description: Concept created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  headerUuid:
                    type: string
                  allEvents:
                    type: array
                    items:
                      type: object

  /api/normalize/skeleton:
    post:
      tags: [Normalize]
      summary: Create missing core nodes for an existing concept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept]
              properties:
                concept:
                  type: string
                  description: Concept name or UUID
                node:
                  type: string
                  description: Specific core node to create (optional, creates all if omitted)
                dryRun:
                  type: boolean
      responses:
        '200':
          description: Skeleton result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  created:
                    type: array
                    items:
                      type: string
                  missing:
                    type: array
                    items:
                      type: string

  /api/normalize/json:
    post:
      tags: [Normalize]
      summary: Regenerate JSON for core nodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept]
              properties:
                concept:
                  type: string
                node:
                  type: string
      responses:
        '200':
          description: JSON regenerated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  updated:
                    type: array
                    items:
                      type: string

  /api/normalize/create-element:
    post:
      tags: [Normalize]
      summary: Create a new element of a concept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept, name]
              properties:
                concept:
                  type: string
                name:
                  type: string
                json:
                  type: object
      responses:
        '200':
          description: Element created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  elementUuid:
                    type: string

  /api/normalize/save-schema:
    post:
      tags: [Normalize]
      summary: Save or update a concept's JSON Schema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept, schema]
              properties:
                concept:
                  type: string
                schema:
                  type: object
                  description: JSON Schema object
      responses:
        '200':
          description: Schema saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  schemaUuid:
                    type: string

  /api/normalize/save-element-json:
    post:
      tags: [Normalize]
      summary: Save or update an element's JSON data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept, element, json]
              properties:
                concept:
                  type: string
                element:
                  type: string
                json:
                  type: object
      responses:
        '200':
          description: Element JSON saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/normalize/create-property:
    post:
      tags: [Normalize]
      summary: Create a property for a concept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept, name]
              properties:
                concept:
                  type: string
                name:
                  type: string
                description:
                  type: string
                type:
                  type: string
                  enum: [string, number, integer, boolean, object, array]
                enum:
                  type: array
                  items:
                    type: string
                format:
                  type: string
                pattern:
                  type: string
                required:
                  type: boolean
      responses:
        '200':
          description: Property created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  propertyUuid:
                    type: string

  /api/normalize/generate-property-tree:
    post:
      tags: [Normalize]
      summary: Generate property tree from JSON Schema (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept]
              properties:
                concept:
                  type: string
                depth:
                  type: integer
                strategy:
                  type: string
      responses:
        '200':
          description: Property tree generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  tree:
                    type: array
                    items:
                      type: object

  /api/normalize/add-node-as-element:
    post:
      tags: [Normalize]
      summary: Wire an existing node as element of a concept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept, nodeUuid]
              properties:
                concept:
                  type: string
                nodeUuid:
                  type: string
                elementName:
                  type: string
      responses:
        '200':
          description: Node wired as element
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/normalize/link-concepts:
    post:
      tags: [Normalize]
      summary: Create IS_A_SUPERSET_OF between concepts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromConcept, toConcept]
              properties:
                fromConcept:
                  type: string
                toConcept:
                  type: string
                relType:
                  type: string
      responses:
        '200':
          description: Concepts linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  relUuid:
                    type: string

  /api/normalize/enumerate:
    post:
      tags: [Normalize]
      summary: Create ENUMERATES relationship
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept, propertyName, values]
              properties:
                concept:
                  type: string
                propertyName:
                  type: string
                values:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Enumeration created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  enumUuid:
                    type: string

  /api/normalize/set-slug:
    post:
      tags: [Normalize]
      summary: Set or update a node's slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept, slug]
              properties:
                concept:
                  type: string
                slug:
                  type: string
      responses:
        '200':
          description: Slug set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/normalize/create-set:
    post:
      tags: [Normalize]
      summary: Create a new Set node under a Superset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept, name]
              properties:
                concept:
                  type: string
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Set created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  setUuid:
                    type: string

  /api/normalize/add-to-set:
    post:
      tags: [Normalize]
      summary: Add an element to a Set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept, setName, elementName]
              properties:
                concept:
                  type: string
                setName:
                  type: string
                elementName:
                  type: string
      responses:
        '200':
          description: Element added to set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/normalize/fork-node:
    post:
      tags: [Normalize]
      summary: Fork another author's node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromUuid, newName]
              properties:
                fromUuid:
                  type: string
                newName:
                  type: string
      responses:
        '200':
          description: Node forked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  newUuid:
                    type: string

  /api/normalize/set-json-tag:
    post:
      tags: [Normalize]
      summary: Set or update any node's json tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuid, json]
              properties:
                uuid:
                  type: string
                json:
                  type: object
      responses:
        '200':
          description: JSON tag set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/normalize/prune-superset-edges:
    post:
      tags: [Normalize]
      summary: Prune redundant direct Superset edges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept, relType]
              properties:
                concept:
                  type: string
                relType:
                  type: string
                  enum: [HAS_ELEMENT, IS_A_SUPERSET_OF]
      responses:
        '200':
          description: Edges pruned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  log:
                    type: array
                    items:
                      type: string

  /api/normalize/apply-enumerations:
    post:
      tags: [Normalize]
      summary: Apply enumeration relationships for a concept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept]
              properties:
                concept:
                  type: string
      responses:
        '200':
          description: Enumerations applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  applied:
                    type: array
                    items:
                      type: string

  /api/normalize/wire-implicit-elements:
    post:
      tags: [Normalize]
      summary: Wire implicit HAS_ELEMENT edges from z-tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept]
              properties:
                concept:
                  type: string
      responses:
        '200':
          description: Elements wired
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  wired:
                    type: array
                    items:
                      type: string

  /api/normalize/migrate-primary-property-ztags:
    post:
      tags: [Normalize]
      summary: Migrate z-tags to point to primary property concept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept]
              properties:
                concept:
                  type: string
      responses:
        '200':
          description: Z-tags migrated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  migrated:
                    type: array
                    items:
                      type: string

  # ──────────────────────────────────────────────
  # Audit
  # ──────────────────────────────────────────────
  /api/audit/health:
    get:
      tags: [Audit]
      summary: Overall graph health summary
      responses:
        '200':
          description: Health report
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object

  /api/audit/concepts-summary:
    get:
      tags: [Audit]
      summary: Summary of all concepts
      responses:
        '200':
          description: Concept summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        concept:
                          type: string
                        elements:
                          type: integer
                        hasSuperset:
                          type: boolean

  /api/audit/concept:
    get:
      tags: [Audit]
      summary: Detailed audit for one concept
      parameters:
        - name: concept
          in: query
          required: true
          schema:
            type: string
          description: Concept name or UUID
      responses:
        '200':
          description: Concept audit detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object

  /api/audit/stats:
    get:
      tags: [Audit]
      summary: Graph statistics
      description: Returns node/relationship counts by label and type, concept counts, signer counts, and JSON coverage.
      responses:
        '200':
          description: Graph stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      totals:
                        type: object
                      byLabel:
                        type: object
                      byRelType:
                        type: object
                      concepts:
                        type: object
                      signers:
                        type: object
                      jsonCoverage:
                        type: object

  /api/audit/skeletons:
    get:
      tags: [Audit]
      summary: Check all concept skeletons
      parameters:
        - name: concept
          in: query
          required: false
          schema:
            type: string
          description: Optional concept name to filter
      responses:
        '200':
          description: Skeleton check results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object

  /api/audit/orphans:
    get:
      tags: [Audit]
      summary: Find orphaned nodes
      description: Finds nodes with broken z-tags, no z-tags, or empty content.
      responses:
        '200':
          description: Orphan report
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      brokenZ:
                        type: array
                        items:
                          type: object
                      noZ:
                        type: array
                        items:
                          type: object
                      empty:
                        type: array
                        items:
                          type: object

  /api/audit/wiring:
    get:
      tags: [Audit]
      summary: Check relationship wiring
      responses:
        '200':
          description: Wiring check results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        rule:
                          type: string
                        violations:
                          type: array
                          items:
                            type: object
                        count:
                          type: integer

  /api/audit/labels:
    get:
      tags: [Audit]
      summary: Check Neo4j labels
      responses:
        '200':
          description: Label check results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object

  /api/audit/firmware:
    get:
      tags: [Audit]
      summary: Check firmware installation status
      responses:
        '200':
          description: Firmware audit
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                      complete:
                        type: integer
                      partial:
                        type: integer
                      missing:
                        type: integer
                  firmwareReady:
                    type: boolean

  /api/audit/threads:
    get:
      tags: [Audit]
      summary: Analyze class threads
      parameters:
        - name: concept
          in: query
          schema:
            type: string
        - name: mode
          in: query
          schema:
            type: string
            enum: [elements, sets, paths]
        - name: through
          in: query
          schema:
            type: string
          description: Set name to filter through
        - name: depth
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Thread analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object

  # ──────────────────────────────────────────────
  # Firmware
  # ──────────────────────────────────────────────
  /api/firmware/install:
    post:
      tags: [Firmware]
      summary: Install or reinstall firmware concepts
      description: Two-pass process that bootstraps all concepts and elements, then enriches JSON Schemas. Long-running (up to 10 minutes).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                versionId:
                  type: string
      responses:
        '200':
          description: Installation log
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  log:
                    type: array
                    items:
                      type: string

  /api/firmware/manifest:
    get:
      tags: [Firmware]
      summary: Get firmware manifest
      description: Returns all concepts, relationship types, elements, enumerations, and sets defined in the active firmware version.
      responses:
        '200':
          description: Firmware manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
