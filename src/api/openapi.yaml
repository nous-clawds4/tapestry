      description: Searches nostr kind 0 profiles. Supports WoT scoring, NIP-05 lookup, and direct pubkey lookup.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: wotPov
          in: query
          schema:
            type: string
            enum: [house, user]
          description: Web of Trust point of view
        - name: userPubkey
          in: query
          schema:
            type: string
          description: Hex pubkey for user WoT POV
        - name: pubkeyLookup
          in: query
          schema:
            type: string
          description: Direct pubkey lookup (bypasses search)
        - name: nip05Lookup
          in: query
          schema:
            type: string
          description: NIP-05 identifier for parallel verification
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  hits:
                    type: array
