<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 375" width="375" height="375" role="img">
  <title>Tapestry Assistant</title>
  <!--
    The Tapestry Assistant badge: the product's brain-and-lightning mark on a
    filled disc, for overlaying on an avatar (ta-avatar #1, ADR 0001).

    Derived from brainstorm.svg, which cannot be used directly here: it is a
    transparent-background export whose purple brain disappears against a dark
    table row at badge size. The two artwork paths are copied verbatim — the
    brain recolored white to read against the disc, the bolt keeping its orange —
    in the original paint order, so the brain's evenodd hole still lets the bolt
    show through. brainstorm.svg's <defs> (a filter and a mask that exist only to
    paint a ~4.5-unit artifact blob at 1% opacity) are dropped.

    The 0.86 scale insets the mark so it never touches the disc edge (its widest
    point lands 161 from the centre, inside the 187.5 radius) while keeping it
    large enough to read at the ~18px the table rows render it at. The mark is
    centred on (187.5, 187.5) in the source, so the translate is symmetric.
  -->
  <circle cx="187.5" cy="187.5" r="187.5" fill="#9546ed"/>
  <g transform="translate(26.25,26.25) scale(0.86)">
    <path fill="#ff914d" fill-rule="evenodd" d="M 147.132812 144.953125 L 181.222656 85.292969 L 210.820312 102.207031 L 191.304688 136.363281 L 230.113281 136.363281 C 236.191406 136.363281 241.808594 139.597656 244.855469 144.851562 C 247.90625 150.109375 247.929688 156.589844 244.914062 161.867188 L 210.820312 221.523438 L 181.222656 204.613281 L 200.742188 170.453125 L 161.933594 170.453125 C 155.855469 170.453125 150.238281 167.21875 147.1875 161.964844 C 144.140625 156.710938 144.117188 150.226562 147.132812 144.953125 Z M 147.132812 144.953125 "/>
