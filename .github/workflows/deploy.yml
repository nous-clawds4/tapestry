name: Deploy to Production

on:
  push:
    branches: [brainstorm-search]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        timeout-minutes: 60
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 25m
          script: |
            cd /opt/tapestry
            git checkout brainstorm-search 2>/dev/null || git checkout -b brainstorm-search origin/brainstorm-search
            git pull origin brainstorm-search
            docker compose up -d --build
            docker image prune -f
