name: Configure Prod (auto-pay)

on:
  workflow_dispatch:
    inputs:
      enable_auto_pay:
        description: "AUTO_PAY_ENABLED (true/false; blank preserves both enable and cap)"
        type: string
        default: ""
      max_sats:
        description: "AUTO_PAY_MAX_SATS (1-100; blank preserves both enable and cap)"
        type: string
        default: ""
      set_mnemonic:
        description: "Write MDK_WALLET_MNEMONIC from secret MDK_DEMO_WALLET_MNEMONIC"
        type: boolean
        default: false
      set_wallet_id:
        description: "Write MDK_WALLET_ID from secret MDK_DEMO_WALLET_ID"
        type: boolean
        default: false
      clear_mnemonic:
        description: "Remove MDK_WALLET_MNEMONIC from prod .env, then restart"
        type: boolean
        default: false
      issuer_pubkey:
        description: "If set (64-char hex), provision the auto-pay delegate for this issuer"
        type: string
        default: ""
      preflight_claimants:
        description: "Comma-separated claimant npubs/hex; runs read-only trust preflight (needs issuer_pubkey)"
        type: string
        default: ""
      min_rank:
        description: "Minimum trust rank for the preflight (default 3)"
        type: string
        default: "3"
      allowlist_pubkeys:
        description: "Comma-separated 64-char hex pubkeys to write to AUTO_PAY_ALLOWLIST_PUBKEYS (empty = leave unchanged)"
        type: string
        default: ""
      zap_relays:
        description: "Comma-separated wss:// relay URLs to write to AUTO_PAY_ZAP_RELAYS (empty = leave unchanged)"
        type: string
        default: ""
      debug_tick:
        description: "Run one auto-pay tick in the container and print the result JSON (read-only diagnostics; may attempt a real payment)"
        type: boolean
        default: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate inputs and guard secrets
        env:
          MNEMONIC: ${{ secrets.MDK_DEMO_WALLET_MNEMONIC }}
          WALLET_ID: ${{ secrets.MDK_DEMO_WALLET_ID }}
          ENABLE_AUTO_PAY: ${{ inputs.enable_auto_pay }}
          MAX_SATS: ${{ inputs.max_sats }}
          SET_MNEMONIC: ${{ inputs.set_mnemonic }}
          SET_WALLET_ID: ${{ inputs.set_wallet_id }}
        run: |
          if [ -n "$ENABLE_AUTO_PAY" ] || [ -n "$MAX_SATS" ]; then
            if [ -z "$ENABLE_AUTO_PAY" ] || [ -z "$MAX_SATS" ]; then
              echo "::error::enable_auto_pay and max_sats must both be supplied, or both left blank"; exit 1
            fi
            if [ "$ENABLE_AUTO_PAY" != "true" ] && [ "$ENABLE_AUTO_PAY" != "false" ]; then
              echo "::error::enable_auto_pay must be true or false (got '$ENABLE_AUTO_PAY')"; exit 1
            fi
            if ! printf '%s' "$MAX_SATS" | grep -Eq '^([1-9][0-9]?|100)$'; then
              echo "::error::max_sats must be an integer 1-100 (got '$MAX_SATS')"; exit 1
            fi
          fi
          if [ "$SET_MNEMONIC" = "true" ] && [ -z "$MNEMONIC" ]; then
            echo "::error::set_mnemonic=true but secret MDK_DEMO_WALLET_MNEMONIC is empty"; exit 1
          fi
          if [ "$SET_WALLET_ID" = "true" ] && [ -z "$WALLET_ID" ]; then
            echo "::error::set_wallet_id=true but secret MDK_DEMO_WALLET_ID is empty"; exit 1
          fi
          echo "inputs valid"

      # ── Step 1: write the two secret keys (mnemonic + wallet id). This step is
      # the ONLY one that receives the mnemonic in its env, and it does not
      # restart the stack — so a delegate-only / operate-only run never forwards
      # the seed to a runner that has no reason to hold it. ──
      - name: Write secrets via SSH
        if: ${{ inputs.set_mnemonic || inputs.set_wallet_id }}
        uses: appleboy/ssh-action@v1.2.2
        timeout-minutes: 10
        with:
          host: ${{ secrets.DEPLOY_HOST_MAGIC_CARPET }}
          username: ${{ secrets.DEPLOY_USER_MAGIC_CARPET }}
          key: ${{ secrets.DEPLOY_SSH_KEY_MAGIC_CARPET }}
          command_timeout: 8m
          envs: SET_MNEMONIC_IN,MNEMONIC_IN,SET_WALLET_ID_IN,WALLET_ID_IN
          script: |
            umask 077
            set -eu
            cd /opt/tapestry
            touch .env
            set_kv() { # idempotent key replace/append; never prints values
              key="$1"; val="$2"
              grep -v "^${key}=" .env > .env.tmp || true
              printf '%s=%s\n' "$key" "$val" >> .env.tmp
              mv .env.tmp .env
            }
            if [ "$SET_MNEMONIC_IN" = "true" ]; then
              set_kv MDK_WALLET_MNEMONIC "$MNEMONIC_IN"
              echo "mnemonic: written"
            fi
            if [ "$SET_WALLET_ID_IN" = "true" ]; then
              set_kv MDK_WALLET_ID "$WALLET_ID_IN"
              echo "wallet id: written"
            fi
            chmod 600 .env
            echo "secrets step done"
        env:
          SET_MNEMONIC_IN: ${{ inputs.set_mnemonic }}
          MNEMONIC_IN: ${{ secrets.MDK_DEMO_WALLET_MNEMONIC }}
          SET_WALLET_ID_IN: ${{ inputs.set_wallet_id }}
          WALLET_ID_IN: ${{ secrets.MDK_DEMO_WALLET_ID }}

      # ── Step 2: operate. Has NO mnemonic in its env. Applies non-secret config,
      # optionally clears the seed, restarts the stack, provisions the delegate,
      # and runs the read-only trust preflight. ──
      - name: Operate via SSH
        uses: appleboy/ssh-action@v1.2.2
        timeout-minutes: 15
        with:
          host: ${{ secrets.DEPLOY_HOST_MAGIC_CARPET }}
          username: ${{ secrets.DEPLOY_USER_MAGIC_CARPET }}
          key: ${{ secrets.DEPLOY_SSH_KEY_MAGIC_CARPET }}
          command_timeout: 12m
          envs: AUTO_PAY_ENABLED_IN,MAX_SATS_IN,CLEAR_MNEMONIC_IN,ISSUER_IN,PREFLIGHT_CLAIMANTS_IN,MIN_RANK_IN,ALLOWLIST_IN,DEBUG_TICK_IN,ZAP_RELAYS_IN
          script: |
            umask 077
            set -eu
            cd "${TAPESTRY_DIR:-/opt/tapestry}"
            touch .env
            set_kv() { # idempotent key replace/append; never prints values
              key="$1"; val="$2"
              grep -v "^${key}=" .env > .env.tmp || true
              printf '%s=%s\n' "$key" "$val" >> .env.tmp
              mv .env.tmp .env
            }
            session_secret=$(sed -n 's/^SESSION_SECRET=//p' .env | tail -n 1)
            session_secret_check=$session_secret
            case "$session_secret_check" in
              \"*\") session_secret_check=${session_secret_check#\"}; session_secret_check=${session_secret_check%\"} ;;
              \'*\') session_secret_check=${session_secret_check#\'}; session_secret_check=${session_secret_check%\'} ;;
            esac
            session_secret_bytes=$(printf '%s' "$session_secret_check" | LC_ALL=C wc -c | tr -d '[:space:]')
            case "$session_secret_check" in
              ""|"brainstorm-default-session-secret-please-change-in-production") replace_session_secret=true ;;
              *) [ "$session_secret_bytes" -lt 32 ] && replace_session_secret=true || replace_session_secret=false ;;
            esac
            if [ "$replace_session_secret" = "true" ]; then
              session_secret=$(openssl rand -hex 32)
              [ "${#session_secret}" -eq 64 ] || { echo "::error::failed to generate SESSION_SECRET"; exit 1; }
              set_kv SESSION_SECRET "$session_secret"
              echo "session secret: generated"
            else
              echo "session secret: preserved"
            fi
            unset session_secret
            unset replace_session_secret
            unset session_secret_check
            unset session_secret_bytes
            if [ -n "$AUTO_PAY_ENABLED_IN" ] && [ -n "$MAX_SATS_IN" ]; then
              set_kv AUTO_PAY_ENABLED "$AUTO_PAY_ENABLED_IN"
              set_kv AUTO_PAY_MAX_SATS "$MAX_SATS_IN"
              echo "auto-pay enable and cap: written"
            fi
            if [ -n "$ALLOWLIST_IN" ]; then
              printf '%s' "$ALLOWLIST_IN" | grep -Eq '^[0-9a-f]{64}(,[0-9a-f]{64})*$' || { echo "::error::allowlist_pubkeys must be comma-separated 64-char lowercase hex"; exit 1; }
              set_kv AUTO_PAY_ALLOWLIST_PUBKEYS "$ALLOWLIST_IN"
              echo "allowlist: written"
            fi
            if [ "$CLEAR_MNEMONIC_IN" = "true" ]; then
              # Remove the seed from prod .env (no SSH-less alternative otherwise).
              grep -v '^MDK_WALLET_MNEMONIC=' .env > .env.tmp || true; mv .env.tmp .env
              echo "mnemonic: cleared"
            fi
            chmod 600 .env
            echo "env keys now present:"
            cut -d= -f1 .env
            docker compose up -d
            if [ -n "$ISSUER_IN" ]; then
              echo "$ISSUER_IN" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::issuer_pubkey must be 64-char lowercase hex"; exit 1; }
              sleep 5
              docker compose exec -T tapestry node /usr/local/lib/node_modules/brainstorm/bin/agent.js provision-delegate --issuer "$ISSUER_IN"
            fi
            if [ -n "$PREFLIGHT_CLAIMANTS_IN" ]; then
              echo "$ISSUER_IN" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::preflight_claimants requires issuer_pubkey as 64-char lowercase hex"; exit 1; }
              # Comma list -> space-separated positional args for the preflight CLI.
              CLAIMANTS_SP=$(printf '%s' "$PREFLIGHT_CLAIMANTS_IN" | tr ',' ' ')
              echo "running read-only trust preflight for issuer $ISSUER_IN (min-rank $MIN_RANK_IN) ..."
              # Absolute path: the whole repo is COPYed to this dir in the image
              # (Dockerfile: COPY . /usr/local/lib/node_modules/brainstorm/), so the
              # script + its node_modules resolve regardless of container CWD.
              # || true: print PASS/FAIL, never fail the job. set -f: the unquoted
              # $CLAIMANTS_SP is intentionally word-split; disable globbing so a
              # stray '*' in the input can't expand against the droplet filesystem.
              ( set -f; docker compose exec -T tapestry node /usr/local/lib/node_modules/brainstorm/scripts/phase1-preflight.js "$ISSUER_IN" $CLAIMANTS_SP --min-rank "$MIN_RANK_IN" ) || true
            fi
            if [ -n "$ZAP_RELAYS_IN" ]; then
              printf '%s' "$ZAP_RELAYS_IN" | grep -Eq '^wss://[^ ,]+(,wss://[^ ,]+)*$' || { echo "::error::zap_relays must be comma-separated wss:// URLs"; exit 1; }
              set_kv AUTO_PAY_ZAP_RELAYS "$ZAP_RELAYS_IN"
              echo "zap relays: written"
              docker compose up -d
            fi
            if [ "$DEBUG_TICK_IN" = "true" ]; then
              echo "=== auto-pay debug tick ==="
              docker compose exec -T tapestry node -e 'require("/usr/local/lib/node_modules/brainstorm/src/services/autoPayWatcher.js").runAutoPayTick().then(r=>{console.log(JSON.stringify(r,null,2));process.exit(0)}).catch(e=>{console.error("TICK_ERR",e.message);process.exit(1)})' || true
              echo "=== recent tapestry logs (auto-pay) ==="
              docker compose logs --tail 400 tapestry 2>&1 | grep -i 'auto-pay\|wallet\|rank' | tail -60 || true
            fi
            echo "done"
        env:
          DEBUG_TICK_IN: ${{ inputs.debug_tick }}
          ZAP_RELAYS_IN: ${{ inputs.zap_relays }}
          AUTO_PAY_ENABLED_IN: ${{ inputs.enable_auto_pay }}
          MAX_SATS_IN: ${{ inputs.max_sats }}
          CLEAR_MNEMONIC_IN: ${{ inputs.clear_mnemonic }}
          ISSUER_IN: ${{ inputs.issuer_pubkey }}
          PREFLIGHT_CLAIMANTS_IN: ${{ inputs.preflight_claimants }}
          MIN_RANK_IN: ${{ inputs.min_rank }}
          ALLOWLIST_IN: ${{ inputs.allowlist_pubkeys }}
