name: Deploy to Tags

on:
  push:
    branches: [feat/tags]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        timeout-minutes: 60
        with:
          host: ${{ secrets.DEPLOY_HOST_TAGS }}
          username: ${{ secrets.DEPLOY_USER_TAGS }}
          key: ${{ secrets.DEPLOY_SSH_KEY_TAGS }}
          command_timeout: 25m
          script: |
            # Fail fast: any non-zero exit aborts the script. Without this,
            # a docker-build failure was silently followed by `docker image
            # prune` (exit 0), and the SSH action reported success while the
            # old container kept running. Discovered post-Story-16 deploy
            # 2026-05-27 — see engineering-team/stories/16-*.md timeline.
            set -euo pipefail
            cd /opt/tapestry
            git checkout -- docker-compose.yml 2>/dev/null || true
            # Fetch first: the droplet was cloned/checked-out on the old
            # feat/pubkey-tagging-target branch and has never seen feat/tags,
            # so origin/feat/tags must be fetched before the checkout below can
            # create the local tracking branch (would otherwise abort under set -e).
            git fetch origin
            git checkout feat/tags 2>/dev/null || git checkout -b feat/tags origin/feat/tags
            git pull origin feat/tags
            # Tags droplet uses host nginx on port 80, so Docker must bind to 8080 on localhost only
            sed -i 's/"80:80"/"127.0.0.1:8080:80"/' docker-compose.yml
            docker compose up -d --build
            docker image prune -f
