name: Deploy to Brainstorm World

on:
  push:
    branches: [refactor-paths]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        timeout-minutes: 60
        with:
          host: ${{ secrets.DEPLOY_HOST_BRAINSTORM }}
          username: ${{ secrets.DEPLOY_USER_BRAINSTORM }}
          key: ${{ secrets.DEPLOY_SSH_KEY_BRAINSTORM }}
          command_timeout: 25m
          script: |
            cd /opt/tapestry
            git checkout refactor-paths 2>/dev/null || git checkout -b refactor-paths origin/refactor-paths
            git pull origin refactor-paths
            docker compose up -d --build
            docker image prune -f
