services:
  tapestry:
    container_name: tapestry
    build: .
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "80:80"
      - "7777:7777"
      - "7778:7778"
      - "7474:7474"
      - "7687:7687"
      - "8687:8687" # Neo4j Bolt (proxied via nginx TCP stream from 7687)
    environment:
      - OWNER_PUBKEY=${OWNER_PUBKEY}
      - ADMIN_PUBKEYS=${ADMIN_PUBKEYS}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      # Auto-pay bounty payouts. OFF by default — the watcher only starts when
      # AUTO_PAY_ENABLED=true, and paying needs MDK_WALLET_MNEMONIC (the float)
      # and RELAY_KEY_MASTER_KEY (to decrypt the issuer's delegate key). Set
      # these in the host .env to enable in prod; leave unset for a plain stack.
      # NOTE: DEV_SKIP_TRUST_CHECK is deliberately NOT here — trust gating stays
      # enforced in prod; that bypass lives only in docker-compose.dev.yml.
      - AUTO_PAY_ENABLED=${AUTO_PAY_ENABLED:-false}
      - AUTO_PAY_ALLOWLIST_PUBKEYS=${AUTO_PAY_ALLOWLIST_PUBKEYS:-}
      - AUTO_PAY_MAX_SATS=${AUTO_PAY_MAX_SATS:-5000}
      - AUTO_PAY_INTERVAL_MS=${AUTO_PAY_INTERVAL_MS:-30000}
      - AUTO_PAY_ZAP_RELAYS=${AUTO_PAY_ZAP_RELAYS:-wss://localhost:7777}
      - MDK_WALLET_MNEMONIC=${MDK_WALLET_MNEMONIC:-}
      - MDK_WALLET_ID=${MDK_WALLET_ID:-}
      - MDK_WALLET_NETWORK=${MDK_WALLET_NETWORK:-mainnet}
      - RELAY_KEY_MASTER_KEY=${RELAY_KEY_MASTER_KEY:-}
      # Search-engine indexing opt-in (ADR 0036). Defaults to false so a new
      # sandbox never competes with production in search results before anyone
      # remembers to configure it. Production sets ALLOW_INDEXING=true in .env.
      - ALLOW_INDEXING=${ALLOW_INDEXING:-false}
    volumes:
      - tapestry-neo4j:/var/lib/neo4j/data
      - tapestry-strfry:/var/lib/strfry
      - tapestry-data:/var/lib/brainstorm
      - tapestry-logs:/var/log/brainstorm
    restart: unless-stopped

  # --- Redis (streaming ETL queue: strfry → Neo4j) ---
  redis:
    image: redis:7-alpine
    container_name: tapestry-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Nostr Search (Meilisearch-powered profile search) ---
  nostr-search-meili:
    image: getmeili/meilisearch:v1.12
    container_name: nostr-search-meili
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - nostr-search-meili:/meili_data
    environment:
      - MEILI_ENV=${MEILI_ENV:-development}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-}
      - MEILI_NO_ANALYTICS=true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nostr-search-api:
    build:
      context: ./nostr-search
      dockerfile: Dockerfile
    container_name: nostr-search-api
    ports:
      - "${NOSTR_SEARCH_PORT:-3069}:3069"
    environment:
      - MEILI_URL=http://nostr-search-meili:7700
      - RELAY_URL=ws://tapestry:80/relay
      - PORT=3069
    depends_on:
      nostr-search-meili:
        condition: service_healthy
      tapestry:
        condition: service_started
    restart: unless-stopped

volumes:
  tapestry-neo4j:
  tapestry-strfry:
  tapestry-data:
  tapestry-logs:
  nostr-search-meili:
